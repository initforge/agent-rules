# behavior-contract.schema.yaml — executable-parity Draft-07 contract
$schema: "http://json-schema.org/draft-07/schema#"
title: BehaviorContract
description: "Closed behavior, state, motion, responsive, accessibility, and interaction contract."
type: object
additionalProperties: false
required: [behaviors]
properties:
  behaviors:
    type: object
    minProperties: 1
    propertyNames:
      allOf:
        - $ref: "common.schema.yaml#/definitions/nonBlank"
        - pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
    additionalProperties:
      $ref: "#/definitions/behaviorDeclaration"
definitions:
  behaviorDeclaration:
    type: object
    additionalProperties: false
    required:
      - behavior_must
      - states_must
      - motion_must
      - responsive_must
    properties:
      behavior_must:
        $ref: "#/definitions/nonEmptyUniqueStrings"
      states_must:
        $ref: "#/definitions/nonEmptyUniqueStrings"
      motion_must:
        $ref: "#/definitions/nonEmptyUniqueStrings"
      responsive_must:
        $ref: "#/definitions/nonEmptyUniqueStrings"
      accessibility:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [requirement, reference, verification_method]
          properties:
            requirement:
              $ref: "common.schema.yaml#/definitions/nonBlank"
            reference:
              $ref: "common.schema.yaml#/definitions/nonBlank"
            verification_method:
              $ref: "common.schema.yaml#/definitions/nonBlank"
      interaction_flows:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [trigger, expected_sequence, negative_invariant]
          properties:
            trigger:
              $ref: "common.schema.yaml#/definitions/nonBlank"
            expected_sequence:
              $ref: "#/definitions/nonEmptyUniqueStrings"
            negative_invariant:
              $ref: "common.schema.yaml#/definitions/nonBlank"
  nonEmptyUniqueStrings:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "common.schema.yaml#/definitions/nonBlank"
