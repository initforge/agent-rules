schema_version: 1
services:
  - id: engine
    kind: node
    status: EXISTS
    path: packages/engine
    note: canonical contracts, controller, verifier, terminal gate
  - id: cli
    kind: node
    status: EXISTS
    path: packages/cli
    note: thin commander CLI
  - id: autopilot-supervisor
    kind: process
    status: GAP
    note: host-neutral durable supervisor not yet implemented
  - id: integration-train
    kind: process
    status: GAP
    note: rolling train merge owner not yet implemented
ports:
  - service: engine-mcp
    port: TBD
    host: 127.0.0.1
    note: GAP — engine broker port unassigned
ingress:
  public_ingress: GAP
  note: no public deployment; harness is local-first
databases:
  - id: ledger
    kind: json-file
    status: EXISTS
    path: .agent/ledger/<plan-id>.json
    note: canonical runtime state
queues:
  - id: ready-queue
    status: GAP
    note: cross-stage typed ready queue from AM-0019 §4
migrations:
  - id: ledger-revision
    status: EXISTS
    note: shadow revision sequence (r57 current)
  - id: db-migrations
    status: GAP
    note: no service DB yet
health:
  probe: agent-rules doctor
  status: EXISTS
journeys:
  - id: plan-lifecycle
    steps:
      - inventory
      - adopt
      - reconcile
      - repair
      - finalize
    status: EXISTS
  - id: runtime-lifecycle
    steps:
      - install
      - update
      - rollback
      - uninstall
    status: EXISTS
  - id: run-execution
    steps:
      - run
      - status
      - resume
      - cancel
    status: EXISTS
  - id: full-stack-public-ingress
    status: GAP
    note: requires exact deployed topology (AM-0019 §8)
rollback:
  installer: runtime update --rollback
  ledger: activation generation backup restore
  local_branch: revert merge commit / keep worktrees until owner review
