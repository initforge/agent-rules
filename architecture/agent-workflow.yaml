version: 1
workflow: Request -> Plan -> WorkPacket -> TaskContext -> CapabilitySelection -> Execution -> Verification -> RunResult
domains:
  - id: WF-INTAKE
    name: Request and plan admission
    owner: packages/kernel/src/northstar/plan-compiler.ts
    entrypoint: packages/cli/src/commands/northstar-ux.ts
    checks: [WF-V3-01, WF-V3-02]
    file_budget: 800
  - id: WF-EXECUTION
    name: Managed workflow execution
    owner: packages/kernel/src/workflow/agent-workflow.ts
    entrypoint: packages/kernel/src/northstar/runtime.ts
    consumers: [direct-run, strong-planner-run, pasted-contract, resume]
    checks: [WF-V3-03, WF-V3-04, WF-V3-05]
    file_budget: 800
  - id: WF-CONTEXT
    name: Worker task context
    owner: packages/kernel/src/workflow/task-context.ts
    entrypoint: packages/kernel/src/northstar/runtime.ts
    consumers: [worker, resume]
    checks: [WF-V3-06]
    file_budget: 400
  - id: WF-RESULT
    name: Evidence-derived result
    owner: packages/kernel/src/workflow/result.ts
    entrypoint: packages/kernel/src/northstar/runtime.ts
    consumers: [status, release]
    checks: [WF-V3-07]
    file_budget: 400
  - id: NATIVE-HOSTS
    name: Native host lifecycle
    owner: packages/cli/src/native/probe.ts
    entrypoint: packages/cli/src/services/native-installer.ts
    consumers: [install, uninstall, doctor]
    checks: [NATIVE-01, NATIVE-02, NATIVE-03]
    file_budget: 500
  - id: NATIVE-MCP
    name: Explicit integration lifecycle
    owner: packages/cli/src/commands/integration.ts
    entrypoint: packages/cli/src/runtime/composed-installer.ts
    consumers: [integration-enable, integration-disable, integration-doctor]
    checks: [MCP-01, MCP-02]
    file_budget: 500
  - id: RELEASE
    name: Affected and full verification
    owner: automation/verify-all.mjs
    entrypoint: .github/workflows/quality.yml
    consumers: [local-release, CI]
    checks: [REL-01, REL-02]
    file_budget: 700
