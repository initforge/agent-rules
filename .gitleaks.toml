# gitleaks allowlist: scoped to explicit test-fixture / design / archived-evidence
# files that intentionally contain dummy API-key-shaped literals. This does NOT
# weaken scanning for real source/config: every other path is scanned strictly.
[extend]
useDefault = true

[allowlist]
description = "dummy key-shaped literals in explicit test fixtures and design/evidence archives"
paths = [
  # Current design artifact: Pencil (.pen) files embed tool-generated UUID
  # literals that match generic-key shapes; they are design evidence, not keys.
  '''docs/design/agent_rules_controlplane\.pen''',
  '''packages/engine/test/portable-checkpoint\.test\.ts''',
  '''packages/kernel/test/checkpoint-resume-adversarial\.test\.ts''',
  # Historical-only: these files were removed from HEAD together with the
  # retired Control Plane product. The entries suppress matches inside
  # rewritten-history scans (root..HEAD) and match nothing in the current tree.
  '''packages/control-plane/tests/services\.test\.ts''',
  '''packages/control-plane/tests/api\.test\.ts''',
]
