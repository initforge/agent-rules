# gitleaks allowlist: scoped to explicit test-fixture / design / archived-evidence
# files that intentionally contain dummy API-key-shaped literals. This does NOT
# weaken scanning for real source/config: every other path is scanned strictly.
[extend]
useDefault = true

[allowlist]
description = "dummy key-shaped literals in explicit test fixtures and design/evidence archives"
paths = [
  '''packages/engine/test/portable-checkpoint\.test\.ts''',
  '''packages/kernel/test/checkpoint-resume-adversarial\.test\.ts''',
  '''\.agent/archive/evidence/candidate-freeze-.*\.json''',
]
