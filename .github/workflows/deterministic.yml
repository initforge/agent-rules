name: deterministic
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  lint:
    name: lint (tsc)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: packages/cli
      - run: npx tsc --noEmit
        working-directory: packages/cli
  test:
    name: test (unit + parity)
    needs: [lint]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: packages/cli
      - run: npx vitest run --reporter=junit --outputFile=test-results.xml 2>&1 || npx vitest run 2>&1
        working-directory: packages/cli
        continue-on-error: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: packages/cli/test-results.xml
          if-no-files-found: ignore
  build:
    name: build (runtime)
    needs: [test]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npx tsc
        working-directory: packages/cli
      - run: node dist/index.js build
        working-directory: packages/cli
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-build-${{ matrix.os }}
          path: |
            generated/runtime-build/*/manifest.json
            generated/runtime-build/*/model-policy.json
  validate:
    name: validate (context)
    needs: [build]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PowerShell on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq powershell
      - run: npm ci && npx tsc
        working-directory: packages/cli
      - run: node dist/index.js validate
        working-directory: packages/cli
      - run: pwsh -File automation/03-validate-context.ps1
      - run: pwsh -File automation/01-build-runtime.ps1
      - run: pwsh -File automation/04-verify-mirrors.ps1
      - name: Validate documentation drift
        run: |
          python automation/generate-doc-references.py
          python automation/validate-doc-drift.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validate-log-${{ matrix.os }}
          path: packages/cli/validate.log
          if-no-files-found: ignore
  verify-mirrors:
    name: verify-mirrors
    needs: [build]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npx tsc
        working-directory: packages/cli
      - run: node dist/index.js verify-mirrors
        working-directory: packages/cli
