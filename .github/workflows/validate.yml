name: Validate Context
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npx tsc
        working-directory: packages/cli
      - run: node dist/index.js validate
        working-directory: packages/cli
