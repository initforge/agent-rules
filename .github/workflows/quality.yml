name: Quality
on:
  push:
  pull_request:
concurrency:
  group: quality-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    timeout-minutes: 30
    # Keep browser binaries in the workspace cache on every OS.  Setting this
    # at job scope is required because npm test launches Playwright in a later
    # step than the install preflight.
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    strategy:
      matrix:
        include:
          - host: linux
            os: ubuntu-latest
          - host: windows
            os: windows-latest
          - host: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: lts/*
      - run: npm ci
      - name: Playwright preflight check (Linux)
        if: matrix.host == 'linux'
        run: |
          npx playwright install chromium --with-deps
          echo "PLAYWRIGHT_READY=true" >> $GITHUB_ENV
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
      - name: Playwright preflight check (Windows)
        if: matrix.host == 'windows'
        shell: pwsh
        run: npx playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
      - name: Playwright preflight check (macOS)
        if: matrix.host == 'macos'
        run: npx playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
      - run: npm run build
      - run: npm run check
      - run: npm run test
      - name: Packaged runtime lifecycle smoke
        run: npm run test:package-smoke -w packages/cli
      - name: Start Control Plane
        run: node automation/control-plane-ci.mjs start
      - name: Wait for Control Plane
        run: npx wait-on http://127.0.0.1:3099/api/health
      - name: Run C4 integration tests
        run: npx vitest run packages/control-plane/tests/c4.test.ts
        env:
          CI: 'true'
      - name: Cleanup Control Plane
        if: always()
        run: node automation/control-plane-ci.mjs stop

  python-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: lts/*
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: npm ci
      # The tsx CLI entrypoint eagerly imports the engine package, whose
      # workspace export points at packages/engine/dist. Build only that
      # dependency here instead of repeating the root build from quality.
      - name: Build context graph dependency
        run: npm run build -w packages/engine
      - name: Generate context graph
        run: npx tsx packages/cli/src/index.ts context-graph build
      - run: pip install --require-hashes -r requirements.txt
      - run: python automation/run-python-tests.py
      - name: Test AM0015 evidence gate
        run: python automation/test-scorecard-evidence.py
      - name: Gather AM0015 evidence candidate
        run: python automation/gather-scorecard-evidence.py --candidate-sha "${{ github.sha }}"
        env:
          SCORECARD_OUTPUT: ${{ runner.temp }}/scorecard-evidence.json
      - name: Validate AM0015 evidence candidate
        run: python automation/gather-scorecard-evidence.py --validate-only --candidate-sha "${{ github.sha }}"
        env:
          SCORECARD_OUTPUT: ${{ runner.temp }}/scorecard-evidence.json

  security:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Gitleaks computes the diff against the previous commit/base ref. A
      # shallow checkout can omit that object and make the strict scan fail
      # before scanning any content.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: lts/*
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Semgrep SAST
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d
        with:
          config: p/default
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ github.token }}

  quality-aggregate:
    if: always()
    needs: [quality, python-tests, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          echo 'Quality: ${{ toJSON(needs.quality.result) }}'
          echo 'Security: ${{ toJSON(needs.security.result) }}'
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "Quality check failed on one or more matrix jobs"
            exit 1
          fi
          if [ "${{ needs.python-tests.result }}" != "success" ]; then
            echo "Python quality checks failed"
            exit 1
          fi
          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "Security checks failed"
            exit 1
          fi
