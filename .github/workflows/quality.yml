name: Quality
on:
  push:
  pull_request:
concurrency:
  group: quality-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    timeout-minutes: 30
    # Keep browser binaries in the workspace cache on every OS.  Setting this
    # at job scope is required because npm test launches Playwright in a later
    # step than the install preflight.
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    strategy:
      matrix:
        include:
          - host: linux
            os: ubuntu-latest
            full_gate: true
          - host: windows
            os: windows-latest
            full_gate: false
          - host: macos
            os: macos-latest
            full_gate: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Preserve canonical LF bytes (Windows)
        if: matrix.host == 'windows'
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          # Force the index blobs back into the worktree after changing the
          # conversion policy; a normal checkout can leave already-materialized
          # CRLF files untouched when Git considers them clean.
          git checkout-index --force --all
          git ls-files --eol .agent/current.json .agent/ledger/v3-decision-fabric.json .agent/plans/v3-decision-fabric/original.md
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: lts/*
      - run: npm ci
      - name: Playwright preflight check (Linux)
        if: matrix.host == 'linux'
        timeout-minutes: 20
        run: |
          npx playwright install chromium --with-deps
          echo "PLAYWRIGHT_READY=true" >> $GITHUB_ENV
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
      - run: npm run build
        if: matrix.full_gate
      - run: npm run check
        if: matrix.full_gate
      - name: Validate the ACTIVE plan pointer and its contracts
        if: matrix.full_gate
        run: |
          node automation/validate-canonical-plan.mjs
          node automation/validate-workflow-v3.mjs
      - run: npm run test
        if: matrix.full_gate
      - name: Packaged runtime lifecycle smoke
        if: matrix.full_gate
        run: npm run test:package-smoke -w packages/cli
      - name: Process-level integration suite
        if: matrix.full_gate
        run: node automation/test-process-level-integration.mjs
      - name: Skill live behavior canaries
        if: matrix.full_gate
        run: node automation/skill-live-canary.mjs
      - name: Cross-platform native path smoke
        if: "!matrix.full_gate"
        run: npm test -w packages/cli -- install.test.ts

  python-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: lts/*
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: npm ci
      # The tsx CLI entrypoint eagerly imports the engine package, whose
      # workspace export points at packages/engine/dist. Build its workspace
      # dependency chain here instead of repeating the root build from quality.
      - name: Build context graph kernel dependency
        run: npm run build -w packages/kernel
      - name: Build context graph engine dependency
        run: npm run build -w packages/engine
      - name: Build context graph CLI dependency
        run: npm run build -w packages/cli
      - name: Generate context graph
        run: node automation/build-context-graph.mjs
      - run: pip install --require-hashes -r requirements.txt
      - run: python automation/run-python-tests.py
      - name: Test AM0015 evidence gate
        run: python automation/test-scorecard-evidence.py
      - name: Gather AM0015 evidence candidate
        run: python automation/gather-scorecard-evidence.py --candidate-sha "${{ github.sha }}"
        env:
          SCORECARD_OUTPUT: ${{ runner.temp }}/scorecard-evidence.json
      - name: Validate AM0015 evidence candidate
        run: python automation/gather-scorecard-evidence.py --validate-only --candidate-sha "${{ github.sha }}"
        env:
          SCORECARD_OUTPUT: ${{ runner.temp }}/scorecard-evidence.json

  security:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Gitleaks computes the diff against the previous commit/base ref. A
      # shallow checkout can omit that object and make the strict scan fail
      # before scanning any content.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: lts/*
      - run: npm ci
      - name: npm audit
        timeout-minutes: 15
        run: npm audit --audit-level=high
      - name: Semgrep SAST
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d
        timeout-minutes: 15
        with:
          config: p/default
      - name: Secret scanning
        timeout-minutes: 15
        run: |
          # gitleaks-action resolves the scan base from github.event.before. After the
          # history convergence rewrite the ref is rewritten so the base commit has no
          # parent, which makes `before^` ambiguous. Scan the whole rewritten chain
          # (root..HEAD) deterministically instead.
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          BASE="$(git rev-list --max-parents=0 HEAD)"
          ./gitleaks detect --source . --config .gitleaks.toml --redact --report-format=sarif --report-path=results.sarif --log-opts="--first-parent --no-merges $BASE..HEAD"

  quality-aggregate:
    if: always()
    needs: [quality, python-tests, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          echo 'Quality: ${{ toJSON(needs.quality.result) }}'
          echo 'Security: ${{ toJSON(needs.security.result) }}'
          echo 'Attestation: hosted quality is external evidence for ${{ github.sha }}'
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "Quality check failed on one or more matrix jobs"
            exit 1
          fi
          if [ "${{ needs.python-tests.result }}" != "success" ]; then
            echo "Python quality checks failed"
            exit 1
          fi
          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "Security checks failed"
            exit 1
          fi
      - name: Write external hosted-CI attestation
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: node automation/record-ci-attestation.mjs "$RUNNER_TEMP/quality-attestation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-external-attestation
          path: ${{ runner.temp }}/quality-attestation.json
          if-no-files-found: error
          retention-days: 7
