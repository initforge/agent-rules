name: Certification
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  release:
    types: [published]
concurrency:
  group: certification-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runner-requirements:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_runners: ${{ steps.check-runners.outputs.has_runners }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Report external runner requirements
        env:
          REQUIRED_LABELS: codex-native,claude-native,grok-native,opencode-native,antigravity-native,cursor-native,deepseek-harness-native,command-code-native,omp-native
        run: |
          echo "Required external self-hosted labels: ${REQUIRED_LABELS}"
          echo "GitHub-hosted CI cannot truthfully assert external runner availability."
          echo "Certification matrix comes from the canonical 9-host registry (platforms/platform-contracts.json), never a hard-coded subset."
          set +e
          DIAGNOSTICS_OUTPUT="$RUNNER_TEMP/certification-diagnostics.json" \
            REQUESTED_MODEL="qwencoder/qwen3.7-max" npx --no-install tsx automation/local-certification-diagnostics.ts
          test "$?" -eq 78
      - name: Check self-hosted runner availability per host label
        id: check-runners
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          MISSING=""
          for LABEL in codex-native claude-native grok-native opencode-native antigravity-native cursor-native deepseek-harness-native command-code-native omp-native; do
            COUNT=$(gh api "repos/${{ github.repository }}/actions/runners" --jq "[.runners[] | select(.labels[]?.name == \"$LABEL\")] | length" 2>/dev/null || echo "0")
            if [ "$COUNT" -gt 0 ]; then
              echo "$LABEL: present"
            else
              echo "$LABEL: missing"
              MISSING="$MISSING $LABEL"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "has_runners_any=false"
            echo "missing_labels=$MISSING"
            echo "has_runners=false"
          else
            echo "has_runners_any=true"
            echo "missing_labels="
            echo "has_runners=true"
          fi
          echo "has_runners_any=$([ -z \"$MISSING\" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "missing_labels=$MISSING" >> "$GITHUB_OUTPUT"
          echo "has_runners=$([ -z \"$MISSING\" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Structured RUNNERS_UNAVAILABLE evidence: write the per-label availability
          # as a real artifact the aggregate can consume (never exit 78 as a red workflow).
          echo "RUNNERS_UNAVAILABLE={\"labels\":{$(for L in codex-native claude-native grok-native opencode-native antigravity-native cursor-native deepseek-harness-native command-code-native omp-native; do C=$(gh api "repos/${{ github.repository }}/actions/runners" --jq "[.runners[] | select(.labels[]?.name == \"$L\")] | length" 2>/dev/null || echo 0); echo -n "\"$L\":$C,"; done | sed 's/,$//')},\"workflow\":\"Certification\"}" > "$RUNNER_TEMP/structured-runners-unavailable.env"
          cat "$RUNNER_TEMP/structured-runners-unavailable.env"
          echo "structured_runners_evidence<<EOF" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/structured-runners-unavailable.env" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: certification-diagnostics
          path: ${{ runner.temp }}/certification-diagnostics.json
          if-no-files-found: error

  certify:
    needs: [runner-requirements]
    if: needs.runner-requirements.outputs.has_runners == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Canonical 9-host registry (platforms/platform-contracts.json) — the
        # registry is the single truth; this matrix mirrors it exactly.
        host: [codex, claude, grok, opencode, antigravity, cursor, deepseek-harness, command-code, omp]
    runs-on: [self-hosted, "${{ matrix.host }}-native"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Certify externally observed native attestation
        env:
          CERTIFICATION_HOST: ${{ matrix.host }}
          CERTIFICATION_COMMIT_SHA: ${{ github.sha }}
          HOST_ATTESTATION_FILE: ${{ runner.temp }}/host-attestation.json
        run: bash automation/ci-certify.sh
      - name: Build exact artifact manifest
        env:
          CERTIFICATION_HOST: ${{ matrix.host }}
          CERTIFICATION_COMMIT_SHA: ${{ github.sha }}
          CERTIFICATION_REPOSITORY: ${{ github.repository }}
          CERTIFICATION_RUN_ID: ${{ github.run_id }}
          CERTIFICATION_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CERTIFICATION_WORKFLOW: ${{ github.workflow }}
          CERTIFICATION_CHECK: ${{ github.job }}
          HOST_ATTESTATION_FILE: ${{ runner.temp }}/host-attestation.json
          CERTIFICATION_OUTPUT: ${{ runner.temp }}/certification-artifact
        run: node automation/certification-ci.mjs certification-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: attestation-${{ matrix.host }}
          path: ${{ runner.temp }}/certification-artifact
          if-no-files-found: error
          retention-days: 7

  certify-watchdog:
    # REQ-015 (S7): a self-hosted job with no matching runner sits in the GitHub
    # queue outside job timeout-minutes. This hosted, bounded watchdog cancels
    # still-queued certify jobs at the deadline and emits explicit advisory
    # evidence (RUNNERS_UNAVAILABLE, exit 78) instead of blocking forever.
    # Certification is not a required check (no pull_request/merge_group
    # trigger), so this advisory failure never blocks merges.
    if: needs.runner-requirements.outputs.has_runners == 'true'
    needs: [runner-requirements]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - name: Bound self-hosted certification queue
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          RUN_JOBS="repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs"
          DEADLINE=$(( $(date +%s) + 840 ))
          while :; do
            CERTIFY_STATES=$(gh api "$RUN_JOBS" --jq '[.jobs[] | select(.name | startswith("certify (")) | .status] | sort | unique | join(",")' 2>/dev/null || echo "QUERY_ERROR")
            if [ "$CERTIFY_STATES" = "QUERY_ERROR" ]; then
              echo "WATCHDOG_ERROR: could not query self-hosted certification job state"
              exit 1
            fi
            case ",$CERTIFY_STATES," in
              *,in_progress,*|*,completed,*)
                echo "SELF_HOSTED_RUNNER_PRESENT: certify jobs reached running/terminal state (states: $CERTIFY_STATES); job-level timeouts bound them"
                exit 0
                ;;
            esac
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "RUNNERS_UNAVAILABLE: self-hosted certify jobs stayed queued beyond the bounded watchdog window; cancelling queued jobs and recording advisory evidence"
              gh api "$RUN_JOBS" --jq '.jobs[] | select(.name | startswith("certify (")) | select(.status == "queued") | .id' 2>/dev/null | while read -r JOB_ID; do
                [ -n "$JOB_ID" ] && gh api -X POST "repos/${{ github.repository }}/actions/jobs/${JOB_ID}/cancel" >/dev/null 2>&1 || true
              done
              echo "ADVISORY: unavailable self-hosted runners produce explicit advisory evidence (RUNNERS_UNAVAILABLE); certification is not a required check"
              exit 78
            fi
            sleep 20
          done

  certify-aggregate:
    if: always() && needs.runner-requirements.result == 'success'
    needs: [runner-requirements, certify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.certify.result == 'success'
        with:
          pattern: attestation-*
          path: ${{ runner.temp }}/attestations
          merge-multiple: true
      - name: Verify exact host set, hashes, metadata, TTL, and model evidence
        if: needs.certify.result == 'success'
        env:
          CERTIFICATION_COMMIT_SHA: ${{ github.sha }}
          CERTIFICATION_REPOSITORY: ${{ github.repository }}
          CERTIFICATION_RUN_ID: ${{ github.run_id }}
          CERTIFICATION_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CERTIFICATION_WORKFLOW: ${{ github.workflow }}
          CERTIFICATION_ARTIFACTS: ${{ runner.temp }}/attestations
        run: node automation/certification-ci.mjs certification-verify
      - name: Verify matrix result
        env:
          CERTIFY_RESULT: ${{ needs.certify.result }}
          MISSING_LABELS: ${{ needs.runner-requirements.outputs.missing_labels }}
          STRUCTURED_EVIDENCE: ${{ needs.runner-requirements.outputs.structured_runners_evidence }}
        run: |
          case "$CERTIFY_RESULT" in
            success)
              echo "native attestation matrix succeeded"
              test "$CERTIFY_RESULT" = success
              ;;
            skipped|cancelled)
              # Structured RUNNERS_UNAVAILABLE evidence (REQ-K3): the per-host
              # label availability is recorded as a real artifact. Advisory
              # only — certification is not a required check, so this step
              # succeeds with the evidence recorded, never exits 78.
              echo "RUNNERS_UNAVAILABLE: no self-hosted native runners matched per-label. Implementation remains valid; structured evidence below."
              echo "missing_labels=$MISSING_LABELS"
              printf '%s\n' "$STRUCTURED_EVIDENCE" > "$RUNNER_TEMP/structured-runners-unavailable.env"
              echo "RUNNERS_UNAVAILABLE=$(printf '%s' "$STRUCTURED_EVIDENCE" | head -c 2000)" >> "$GITHUB_ENV"
              ;;
            *)
              echo "NATIVE_HOST_FAILED: at least one native host genuinely failed certification."
              exit 1
              ;;
          esac
