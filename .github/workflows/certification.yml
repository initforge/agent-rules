name: Certification
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  release:
    types: [published]
concurrency:
  group: certification-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runner-requirements:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Report external runner requirements
        env:
          REQUIRED_LABELS: codex-native,claude-native,grok-native,opencode-native,antigravity-native
        run: |
          echo "Required external self-hosted labels: ${REQUIRED_LABELS}"
          echo "GitHub-hosted CI cannot truthfully assert external runner availability."
          set +e
          DIAGNOSTICS_OUTPUT="$RUNNER_TEMP/certification-diagnostics.json" \
            REQUESTED_MODEL="qwencoder/qwen3.7-max" npx --no-install tsx automation/local-certification-diagnostics.ts
          test "$?" -eq 78
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: certification-diagnostics
          path: ${{ runner.temp }}/certification-diagnostics.json
          if-no-files-found: error

  certify:
    needs: [runner-requirements]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        host: [codex, claude, grok, opencode, antigravity]
    runs-on: [self-hosted, "${{ matrix.host }}-native"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Certify externally observed native attestation
        env:
          CERTIFICATION_HOST: ${{ matrix.host }}
          CERTIFICATION_COMMIT_SHA: ${{ github.sha }}
          HOST_ATTESTATION_FILE: ${{ runner.temp }}/host-attestation.json
        run: bash automation/ci-certify.sh
      - name: Build exact artifact manifest
        env:
          CERTIFICATION_HOST: ${{ matrix.host }}
          CERTIFICATION_COMMIT_SHA: ${{ github.sha }}
          CERTIFICATION_REPOSITORY: ${{ github.repository }}
          CERTIFICATION_RUN_ID: ${{ github.run_id }}
          CERTIFICATION_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CERTIFICATION_WORKFLOW: ${{ github.workflow }}
          CERTIFICATION_CHECK: ${{ github.job }}
          HOST_ATTESTATION_FILE: ${{ runner.temp }}/host-attestation.json
          CERTIFICATION_OUTPUT: ${{ runner.temp }}/certification-artifact
        run: node automation/control-plane-ci.mjs certification-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: attestation-${{ matrix.host }}
          path: ${{ runner.temp }}/certification-artifact
          if-no-files-found: error
          retention-days: 7

  certify-watchdog:
    # REQ-015 (S7): a self-hosted job with no matching runner sits in the GitHub
    # queue outside job timeout-minutes. This hosted, bounded watchdog cancels
    # still-queued certify jobs at the deadline and emits explicit advisory
    # evidence (RUNNERS_UNAVAILABLE, exit 78) instead of blocking forever.
    # Certification is not a required check (no pull_request/merge_group
    # trigger), so this advisory failure never blocks merges.
    if: always()
    needs: [runner-requirements]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - name: Bound self-hosted certification queue
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          RUN_JOBS="repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs"
          DEADLINE=$(( $(date +%s) + 840 ))
          while :; do
            CERTIFY_STATES=$(gh api "$RUN_JOBS" --jq '[.jobs[] | select(.name | startswith("certify (")) | .status] | sort | unique | join(",")' 2>/dev/null || echo "QUERY_ERROR")
            if [ "$CERTIFY_STATES" = "QUERY_ERROR" ]; then
              echo "WATCHDOG_ERROR: could not query self-hosted certification job state"
              exit 1
            fi
            case ",$CERTIFY_STATES," in
              *,in_progress,*|*,completed,*)
                echo "SELF_HOSTED_RUNNER_PRESENT: certify jobs reached running/terminal state (states: $CERTIFY_STATES); job-level timeouts bound them"
                exit 0
                ;;
            esac
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "RUNNERS_UNAVAILABLE: self-hosted certify jobs stayed queued beyond the bounded watchdog window; cancelling queued jobs and recording advisory evidence"
              gh api "$RUN_JOBS" --jq '.jobs[] | select(.name | startswith("certify (")) | select(.status == "queued") | .id' 2>/dev/null | while read -r JOB_ID; do
                [ -n "$JOB_ID" ] && gh api -X POST "repos/${{ github.repository }}/actions/jobs/${JOB_ID}/cancel" >/dev/null 2>&1 || true
              done
              echo "ADVISORY: unavailable self-hosted runners produce explicit advisory evidence (RUNNERS_UNAVAILABLE); certification is not a required check"
              exit 78
            fi
            sleep 20
          done

  certify-aggregate:
    if: always()
    needs: [runner-requirements, certify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: attestation-*
          path: ${{ runner.temp }}/attestations
          merge-multiple: true
      - name: Verify exact host set, hashes, metadata, TTL, and model evidence
        env:
          CERTIFICATION_COMMIT_SHA: ${{ github.sha }}
          CERTIFICATION_REPOSITORY: ${{ github.repository }}
          CERTIFICATION_RUN_ID: ${{ github.run_id }}
          CERTIFICATION_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CERTIFICATION_WORKFLOW: ${{ github.workflow }}
          CERTIFICATION_ARTIFACTS: ${{ runner.temp }}/attestations
        run: node automation/control-plane-ci.mjs certification-verify
      - name: Verify matrix result
        env:
          CERTIFY_RESULT: ${{ needs.certify.result }}
        run: |
          case "$CERTIFY_RESULT" in
            success)
              echo "native attestation matrix succeeded"
              test "$CERTIFY_RESULT" = success
              ;;
            skipped|cancelled)
              echo "RUNNERS_UNAVAILABLE: no self-hosted native runners matched (or queued jobs were cancelled by the bounded watchdog); implementation remains valid. Advisory evidence only — certification is not a required check."
              exit 78
              ;;
            *)
              echo "NATIVE_HOST_FAILED: at least one native host genuinely failed certification."
              exit 79
              ;;
          esac
