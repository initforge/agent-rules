name: Certification
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  release:
    types: [published]
jobs:
  certify:
    strategy:
      matrix:
        host: [codex, cursor, antigravity, grok, opencode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci
      - run: npm run build
      - run: npm run ci:certify -- --host ${{ matrix.host }}

  certify-aggregate:
    if: always()
    needs: [certify]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs.certify.result) }}'
          if [ "${{ needs.certify.result }}" != "success" ]; then
            echo "Certification check failed on one or more matrix jobs"
            exit 1
          fi
