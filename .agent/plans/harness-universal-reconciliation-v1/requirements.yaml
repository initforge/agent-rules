version: 1
plan_id: harness-universal-reconciliation-v1
mode: DELIVER
requirements:
  - id: REQ-001
    statement: Compile raw intent into one portable, hash-bound, resumable execution bundle without requirement or decision loss.
    status: active
    verification: ["npm run build", "npx vitest run test/support-pack.test.ts --config packages/engine/vitest.config.ts"]
  - id: REQ-002
    statement: Make ordinary conversation a sufficient first-class entrypoint and compile conversation, optional slash commands, CLI/API calls, and native host actions into the same canonical WorkRequest and effective-plan semantics; /goal is optional and never authoritative.
    status: active
    verification: ["npm run test:package-smoke -w packages/cli", "node automation/validate-entrypoint-parity.mjs"]
  - id: REQ-003
    statement: Require self-contained worker recipes, disjoint ownership, intent receipts, checkpoints, amendments, and bounded repair.
    status: active
    verification: ["npx vitest run test/support-pack.test.ts --config packages/engine/vitest.config.ts"]
  - id: REQ-004
    statement: Reconcile intent, requirements, claims, tasks, diff, evidence, source locks, providers, hosts, and runtime projections mechanically.
    status: active
    verification: ["npm run test:fast", "node automation/validate-agent-dir.mjs"]
  - id: REQ-005
    statement: Support every registered host adapter while returning UNSUPPORTED rather than false parity for unknown hosts.
    status: active
    verification: ["python automation/test-platform-contracts.py", "python automation/test-platform-lifecycle.py"]
  - id: REQ-006
    statement: Detect installed coding hosts from multiple live facts and fully synchronize selected skills/providers only to installed hosts.
    status: active
    verification: ["npm run test:package-smoke -w packages/cli", "node packages/cli/dist/index.js --json runtime reconcile all --installed-only"]
  - id: REQ-007
    statement: Store external skills, tools, MCP servers, and apps as pinned source/install/provenance records with qualification and rollback.
    status: active
    verification: ["node automation/validate-external-sources.mjs", "node automation/validate-tool-registry.mjs"]
  - id: REQ-008
    statement: Materialize every selected skill completely and portably across all installed hosts while keeping unselected candidates link-only.
    status: active
    verification: ["python automation/validate-agent-skills.py", "python automation/validate-route-parity.py"]
  - id: REQ-009
    statement: Integrate claim-routed providers for disposable dependencies, API contracts, schema testing, UI, mobile, security, performance, and telemetry.
    status: active
    verification: ["node automation/validate-tool-registry.mjs", "python automation/test-select-verification.py"]
  - id: REQ-010
    statement: Prefer real browser or device behavior for business-flow proof and deterministic scripts for contracts without ceremonial overtesting.
    status: active
    verification: ["python automation/test-select-verification.py", "python automation/test-parity-verification.py"]
  - id: REQ-011
    statement: Run local browser, mobile, and Pencil sessions visibly in the foreground; allow headless mode only in explicit CI profiles.
    status: active
    verification: ["node automation/pencil-dogfood.mjs", "npx vitest run test/runner-mcp-config.test.ts --config packages/engine/vitest.config.ts"]
  - id: REQ-012
    statement: Discover Pencil dynamically without persisting ephemeral AppImage mount paths and auto-install official user-space packages when safe.
    status: active
    verification: ["npx vitest run test/runner-mcp-config.test.ts --config packages/engine/vitest.config.ts"]
  - id: REQ-013
    statement: Route skills, capabilities, providers, and verifiers from deterministic facts, impact, claim class, availability, and risk.
    status: active
    verification: ["python automation/validate-route-parity.py", "node automation/validate-decision-fabric.mjs"]
  - id: REQ-014
    statement: Keep one owner per rule, skill, provider, host delta, and plan-local decision while preserving proven legacy behavior until parity.
    status: active
    verification: ["python automation/validate-rule-contracts.py", "python automation/validate-skill-catalog.py"]
  - id: REQ-015
    statement: Bound every CI process and wait, keep hosted quality required, and prevent unavailable self-hosted runners from blocking indefinitely.
    status: active
    verification: ["npm run ci:quality", "node automation/validate-ci-timeouts.mjs"]
  - id: REQ-016
    statement: Dogfood compiled recipes, reconciliation, provider routing, evidence, and runtime parity during this phase.
    status: active
    verification: ["node automation/validate-agent-dir.mjs", "node automation/validate-entrypoint-parity.mjs"]
  - id: REQ-017
    statement: Compact completed plan data without deleting original intent, decisions, source locks, requirement-to-evidence traceability, or PASS evidence.
    status: active
    verification: ["node packages/cli/dist/index.js --json cleanup lifecycle --dry-run", "node automation/validate-agent-dir.mjs"]
  - id: REQ-018
    statement: Prepare exact owner-gated Git closeout, final main CI, installed-host reinstall, and deletion of approved non-main branches only.
    status: active
    verification: ["node packages/cli/dist/index.js --json closeout prepare", "node automation/validate-closeout-receipt.mjs"]
  - id: REQ-019
    statement: Model the harness as a typed closed-loop control system with feedforward and feedback sensors, evidence freshness and independence, explicit failure-to-eval conversion, expiring model-specific workarounds, and bounded runtime clamps.
    status: active
    verification: ["node automation/validate-feedback-flywheel.mjs", "npm run test:fast"]
  - id: REQ-020
    statement: Audit and converge high-impact rules and skills semantically, including lifecycle, planning, completion, context, delegation, research, browser QA, quality, and UI precedence, while keeping full-catalog structural fixtures green.
    status: active
    verification: ["node automation/validate-workflow-semantics.mjs", "python automation/validate-rule-contracts.py", "python automation/validate-skill-catalog.py"]
  - id: REQ-021
    statement: Keep Control Plane work ineligible until every selected skill, provider, tool, MCP, rule, command, host adapter, runtime projection, verification claim, installed-host receipt, required CI check, and owner-approved harness closeout is complete; then run Control Plane V2 as the final phase.
    status: active
    verification: ["node automation/validate-control-plane-final-gate.mjs", "node packages/cli/dist/index.js --json closeout prepare"]
  - id: REQ-022
    statement: Support ordinary-prompt pair repair after implementation or apparent PASS by preserving findings, classifying defect versus requirement change, selectively reopening impacted claims, staling affected evidence by candidate epoch, producing bounded repair packets, and re-deriving acceptance without rewriting history.
    status: active
    verification: ["node automation/validate-pair-repair.mjs", "npm run test:fast"]
