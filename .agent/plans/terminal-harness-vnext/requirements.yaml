requirements:
  - id: REQ-001
    source_id: PF1
    statement: "MCP idle-zero: managed MCP process/socket/RAM/CPU/schema exposure is zero on arbitrary consumer repositories when no task leases the capability; proven live with receipts on G1 fresh and G3 upgraded generic fixtures."
    phases: [P4, P5, P9]
    status: pending
  - id: REQ-002
    source_id: PF2
    statement: "Deterministic output and 5fedu: unrelated generic repositories receive no wrapper/domain leakage; 5fedu appears only when a repository explicitly activates the domain pack; proven by G1/G2 negative output and an explicit 5fedu temporary fixture."
    phases: [P3, P8, P9]
    status: pending
  - id: REQ-003
    source_id: PF3
    statement: "Cross-host enforcement: the same core harness semantics are mapped to native primitives per supported host and enforced at the host capability level; proven by G4 adapter/install/live evidence."
    phases: [P5, P6, P9]
    status: pending
  - id: REQ-004
    source_id: PF4
    statement: "Workflow/dogfood: agent-rules is dogfooded early as the harness's own development environment, then the one-copy workflow is proven on unrelated generic consumer repositories with a cheap worker."
    phases: [P0, P1, P2, P3, P8, P9]
    status: pending
  - id: REQ-005
    source_id: PF5
    statement: "Lifecycle/artifacts: per-consumer-worktree operational state works on first-run repositories and upgraded environments without relying on agent-rules-specific layout; artifact admission/compaction active."
    phases: [P1, P2, P3, P7, P9]
    status: pending
  - id: REQ-006
    source_id: PF6
    statement: "Release completion: exact package is built, installed/upgraded into isolated host homes, used on generic consumer fixtures, exact-SHA CI is green, and terminal closure is idempotent and atomically deactivated."
    phases: [P2, P6, P9]
    status: pending
  - id: REQ-007
    source_id: META-A
    statement: "Terminality: generic consumer tasks must not stop at code complete; worker completes the compiled lifecycle (code/behavior/release/terminal) or reports a precise blocker; generic early-stop eval fails by design."
    phases: [P1, P2, P8, P9]
    status: pending
  - id: REQ-008
    source_id: META-B
    statement: "Root cause: every harness-wide defect fix must be traced through canonical source, host projections, installer/migration and consumer live surfaces; named-project/local patches are not accepted as global remediation."
    phases: [P3, P5, P8]
    status: pending
  - id: REQ-009
    source_id: A
    statement: "Skills Fabric: routing authority is explicit packet request plus consumer RepoFacts/TaskFacts; phrase is only a candidate hint; default is no skill; generic routing/composition/ablation evals pass."
    phases: [P3, P8]
    status: pending
  - id: REQ-010
    source_id: B
    statement: "Ownership/precedence: core invariant > enforceable policy > project/domain truth > task procedure; project-owned instructions are preserved and honored for business truth but cannot waive hard enforcement; G2 proves precedence and conflict surfacing."
    phases: [P3, P6, P8]
    status: pending
  - id: REQ-011
    source_id: C
    statement: "MCP lifecycle: explicit REGISTERED-to-TEARDOWN lifecycle with per-task isolated host config, lease bound to consumer repo/worktree/task/session; no globally advertised enabled managed MCP by default; G1/G3 lifecycle receipts."
    phases: [P4, P9]
    status: pending
  - id: REQ-012
    source_id: D
    statement: "Intent/handoff: one frozen contract contains target discovery policy and disposition; a cheap worker with only the copied artifact completes a consumer task in a fresh unrelated repository without research redo."
    phases: [P2, P8]
    status: pending
  - id: REQ-013
    source_id: E
    statement: "Host adapters: versioned adapter -> packaged projection -> install/upgrade -> generic consumer session chain proven per supported host; absent binaries result in honest static-only evidence, never fake live PASS."
    phases: [P5, P9]
    status: pending
  - id: REQ-014
    source_id: F
    statement: "Evidence binding: every proof receipt binds harness release identity, installation/projection identity, consumer repository/candidate identity and host runtime identity; cross-repo/cross-package replay rejects."
    phases: [P1, P6, P9]
    status: pending
  - id: REQ-015
    source_id: G
    statement: "Root-cause planning: S2/S3/cross-cutting work requires a causal map terminating at canonical harness/adapter/installer mechanisms; unknown root cause triggers discovery instead of symptom patch."
    phases: [P3, P8]
    status: pending
  - id: REQ-016
    source_id: H
    statement: "Autonomy/finish-to-completion: compiled CODE/BEHAVIOR/RELEASE/TERMINAL stages apply to every target contract; worker completes lifecycle in generic consumer tasks, not only when editing the harness."
    phases: [P2, P7, P8, P9]
    status: pending
  - id: REQ-017
    source_id: I
    statement: "Speed: lane scheduler and per-consumer-tree caches hold the speed budget on a generic task corpus (duplicate reads/tool calls -30%, S0/S1 context -20%, no p50 regression); mechanisms winning only in dogfood are retired."
    phases: [P7, P8, P9]
    status: pending
  - id: REQ-018
    source_id: J
    statement: "Artifacts: operational state is ignored/out-of-source on arbitrary worktrees; fresh repositories remain source-clean; crash/resume, upgrade of stale state and reopen from residue all work with content-addressed cold evidence."
