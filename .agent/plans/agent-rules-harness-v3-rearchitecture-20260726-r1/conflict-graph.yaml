schema_version: 1
domains:
  path/glob:
    conflicts:
      - same owned/forbidden path claimed by two clusters
    leases:
      - assignment owned_paths
  public-api-schema:
    conflicts:
      - contract change invalidates affected dependants only
    leases:
      - packages/engine/src/contracts.ts
      - schemas/
  migration:
    conflicts:
      - two writers on same migration revision
    leases:
      - packages/engine/src/ledger-migration.ts
  lockfile:
    conflicts:
      - package-lock.json concurrent mutation
    leases:
      - package-lock.json
  generated-manifest:
    conflicts:
      - generated/ hand-edit or concurrent regeneration
    leases:
      - generated/
  port/container/fixture:
    conflicts:
      - temporary port / compose fixture collision
    leases:
      - temporary ports, compose topology
  shared-data:
    conflicts:
      - browser/MCP context pooled vs per-agent
    leases:
      - browser pool, context cache
  browser-page-lease:
    conflicts:
      - REF/TGT pair page lease collision
    leases:
      - REF:<pair-id>
      - TGT:<pair-id>
ownership:
  - owner: baseline-repair
    paths:
      - packages/cli/src/commands/build.ts
      - packages/control-plane/src/services/safety.ts
      - packages/control-plane/tests/services.test.ts
  - owner: integrate_5fedu_graph
    paths:
      - skills/5fedu-project/**
      - packages/cli/src/services/context-graph.ts
      - platforms/shared/scripts/context-router.py
  - owner: migrate_5fedu_parity_assets
    paths:
      - skills/5fedu-module-parity/**
      - evals/conformance/test_5fedu_module_mapping.py
  - owner: repair_engine_f1_final
    paths:
      - packages/engine/src/contracts.ts
      - packages/engine/test/contracts.test.ts
  - owner: ui-taste-migration
    paths:
      - skills/ui-taste/**
      - automation/build-context-graph.ps1
      - platforms/shared/scripts/context-router.py
  - owner: finish_5fedu_parity_proof
    paths:
      - skills/5fedu-module-parity/references/**
      - evals/conformance/test_5fedu_module_mapping.py
  - owner: repair_5fedu_lean_installer
    paths:
      - profiles/5fedu/behaviors/activation.md
      - profiles/5fedu/profile.yaml
      - profiles/5fedu/automation/08-install-5fedu-context.ps1
      - packages/cli/src/commands/validate.ts
      - profiles/5fedu/automation/test-5fedu-lean-installer.ps1
  - owner: pending
    paths:
      - profiles/5fedu/behaviors/activation.md
      - profiles/5fedu/profile.yaml
      - platforms/shared/scripts/context-router.py
      - automation/context-route-cases.json
  - owner: repair_engine_f1_portable_paths
    paths:
      - packages/engine/package.json
      - packages/cli/package.json
      - package-lock.json
      - packages/engine/src/parity-contracts.ts
      - packages/engine/test/parity-contracts.test.ts
  - owner: parity_behavior_v3
    paths:
      - skills/5fedu-module-parity/references/schemas/behavior-contract.schema.yaml
      - skills/5fedu-module-parity/references/validate-parity-packet.py
      - automation/test-5fedu-parity-packet.py
      - skills/5fedu-module-parity/references/examples/nhap-hang/behavior-contract.yaml
      - skills/5fedu-module-parity/references/index.md
  - owner: parity_deviation_v3
    paths:
      - skills/5fedu-module-parity/references/schemas/deviations.schema.yaml
      - skills/5fedu-module-parity/references/schemas/architecture-adaptation.schema.yaml
      - skills/5fedu-module-parity/references/validate-parity-packet.py
      - automation/test-5fedu-parity-packet.py
      - skills/5fedu-module-parity/references/examples/nhap-hang/deviations.yaml
  - owner: engine
    paths:
      - packages/engine/src/ledger-activation.ts
notes:
  - any post-review commit makes prior review stale
  - contract frozen by integration epoch; change invalidates only affected dependants
