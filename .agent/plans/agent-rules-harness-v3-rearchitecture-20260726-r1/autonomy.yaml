schema_version: 1
readiness_state: BOUNDED_READY
readiness_reasons:
  - "missing host tool(s): codex"
  - external CI not green (Quality/quality-macos:failure)
  - ledger execution_state is NEEDS_REMEDIATION
  - latest review is stale
  - effective identity 21d0a8bbaaf40002 bound to M11
  - "bounded: reversible defaults recorded; owner-only authority retained; independent work may proceed"
authority_envelope:
  allowed:
    - inspect
    - install
    - worktree
    - build
    - test
    - Compose
    - browser
    - commit
    - local-merge
  owner_only:
    - push
    - deploy
    - credential
    - destructive
  source: AM-0019 §3 AuthorityEnvelope; §1 owner-authorized Git boundary
decision_matrix:
  reversible_defaults:
    - action: install
      default: allow
      rollback: runtime update --rollback
    - action: worktree-create
      default: allow
      rollback: remove abandoned worktree after completion/crash
    - action: dependency-install
      default: allow within lockfile
      rollback: restore package-lock.json from git
    - action: local-merge
      default: integration-owner only
      rollback: revert merge commit
    - action: test-rerun
      default: allow
      rollback: none (read-only)
  rollback_policy: reversible ambiguity receives a recorded default; rollback restores the pre-action snapshot
  source: AM-0019 §3 DecisionMatrix
host_capability:
  tools:
    - claude
    - opencode
    - grok
  cpu_count: 1
  total_mem_mb: 15653
  external_ci_green: false
