recoverable_states:
  - state: WAITING_EXTERNAL
    wake: external dependency / CI watcher
    deadline: nonterminal
    fallback: continue independent work
  - state: WAITING_AUTHORITY
    wake: owner decision batch
    deadline: nonterminal
    fallback: proceed on independent closure
  - state: WAITING_RESOURCE
    wake: governor hysteresis
    deadline: nonterminal
    fallback: defer heavy work
  - state: RETRY_SCHEDULED
    wake: retry/backoff policy
    deadline: bounded
    fallback: escalate after two same-root repairs
  - state: NEEDS_REMEDIATION
    wake: repair pack acceptance
    deadline: nonterminal
    fallback: bounded repair slice
blocked_reserved_for: unrecoverable plan invalidation
critical_path:
  - C0
  - C1
  - C2
  - C3
  - C4
  - C8
  - C9
  - C10
scheduling: maximum conflict-free ready antichain; critical-path priority without starving independent tasks
