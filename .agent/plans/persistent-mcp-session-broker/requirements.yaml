version: 1
plan_id: persistent-mcp-session-broker

requirements:
  - id: REQ-001
    statement: Broker runtime state store uses SQLite WAL (or equivalent) with atomic transactions, CAS, concurrent reader/writer safety, crash recovery, file permission 0600, no plaintext secret persistence, schema versioning and migrations.
    status: active
    verification:
      - command: "npx vitest run --root packages/mcp-guardian --config vitest.config.ts test/state-store.test.ts"

  - id: REQ-002
    statement: "acquireLease is idempotent: same logical_session_id + provider capability returns the same lease; concurrent acquires converge; a different logical session cannot reuse an exclusive lease."
    status: active
    verification:
      - command: "npx vitest run --root packages/mcp-guardian --config vitest.config.ts test/broker-lease.test.ts"

  - id: REQ-003
    statement: Lease state machine implements CREATED/ACQUIRING/STARTING/READY/RELOCATED/RECONNECTING/STALE/QUARANTINED/RESOURCE_RECREATED/RELEASED/REVOKED/FAILED with a receipt and reason for every transition, plus closeStaleLeases cleanup and reconcileRuntime/doctor.
    status: active
    verification:
      - command: "npx vitest run --root packages/mcp-guardian --config vitest.config.ts test/broker-lifecycle.test.ts"

  - id: REQ-004
    statement: Exclusive sharing mode is the default; shared-readonly/shared-explicit require an explicit registry/policy marker; no sharing_mode defaults to exclusive.
    status: active
    verification:
      - command: "npx vitest run --root packages/mcp-guardian --config vitest.config.ts test/broker-sharing.test.ts"

  - id: REQ-005
    statement: Guardian starts a provider lazily on the first real capability request, never pre-launching providers for every chat, and every lease acquisition passes through the guardian for GUI providers (guardian_wrapped=true).
    status: active
    verification:
      - command: "npx vitest run --root packages/mcp-guardian --config vitest.config.ts test/guardian-launch.test.ts"

  - id: REQ-006
    statement: Process identity uses PID + /proc/<pid>/stat start time + executable path + command hash; termination revalidates the fingerprint and never kills by bare PID, caller process group, host app, or unleased processes.
    status: active
    verification:
      - command: "npx vitest run --root packages/mcp-guardian --config vitest.config.ts test/guardian-process.test.ts"

  - id: REQ-007
    statement: Window attribution revalidates window id, _NET_WM_PID, WM_CLASS, process start time, workspace and mapped/iconic state; no first-window heuristic and no all-window fallback; stale/reused window ids are rejected.
    status: active
    verification:
      - command: "npx vitest run --root packages/mcp-guardian --config vitest.config.ts test/guardian-window.test.ts"

  - id: REQ-008
    statement: X11 EWMH placement snapshots desktop/active/source windows before launch, moves the provider to initial_workspace with a non-activating move, verifies visible/non-iconic state and unrelated windows unchanged, marks READY, then never auto-moves the provider and records operator relocations as RELOCATED events.
    status: active
    verification:
      - command: "npx vitest run --root packages/mcp-guardian --config vitest.config.ts test/placement-relocation.test.ts"

  - id: REQ-009
    statement: When the MCP process dies but the provider resource survives, reconnectProvider reattaches the same resource; when the resource truly dies, a new resource is created and the lease records RESOURCE_RECREATED with the new resource identity; no silent continuity and no attaching to another chat's lease.
    status: active
    verification:
      - command: "npx vitest run --root packages/mcp-guardian --config vitest.config.ts test/reconnect-recreate.test.ts"

  - id: REQ-010
    statement: OpenCode adapter registers the host session before any visible GUI MCP launch, binds by native OpenCode session id (never CWD alone), projects per-session MCP config from the canonical registry, and rejects direct project-level MCP bypass.
    status: active
    verification:
      - command: "npx vitest run --root packages/mcp-guardian --config vitest.config.ts test/host-opencode.test.ts"

  - id: REQ-011
    statement: DeepSeek Harness adapter detects the exact installed binary/package, attests version (no @latest, no unapproved installs), supports pinned headless invocation with per-project DSH_HOME/profile, and projects rules/skills/MCP from canonical sources.
    status: active
    verification:
      - command: "npx vitest run --root packages/mcp-guardian --config vitest.config.ts test/host-dsh.test.ts"

  - id: REQ-012
    statement: DSH Web multi-session binding uses the native DSH agent/session identity (e.g. ~/.dsh/sessions/<project>/session-<uuid>), gives each agent session its own lease, and honestly reports granularity (chat / host-process / project) without using Web process PID or workspace names as identity.
    status: active
    verification:
      - command: "npx vitest run --root packages/mcp-guardian --config vitest.config.ts test/host-dsh.test.ts"

  - id: REQ-013
    statement: Codex CLI adapter supports per-invocation logical sessions with per-session broker leases and project-scoped config projection; Codex desktop/IDE reports honest capability granularity and never claims per-chat binding from shared config alone.
    status: active
    verification:
      - command: "npx vitest run --root packages/mcp-guardian --config vitest.config.ts test/host-codex.test.ts"

  - id: REQ-014
    statement: Streamable HTTP broker multiplexes per-session MCP protocol sessions with a non-spoofable lease token ACL, enforces session/resource ACLs, and allows resource sharing only for registry-marked shared-safe providers.
    status: active
    verification:
      - command: "npx vitest run --root packages/mcp-guardian --config vitest.config.ts test/http-broker.test.ts"

  - id: REQ-015
    statement: Projection generator emits provider configs (OpenCode JSON, Codex TOML, DSH profile, broker launch config) from the canonical integrations registry with pinned versions, command digest, registry/policy hashes and rollback reference; never @latest, never secrets, never a direct project-level provider bypass.
    status: active
    verification:
      - command: "npx vitest run --root packages/mcp-guardian --config vitest.config.ts test/projection.test.ts"

  - id: REQ-016
    statement: The behavior test matrix protects every DISTINCT invariant from the owner contract §XIV — 8 behavior-matrix cases (host-window binding stability, multi-window same-pid attribution, unrelated-window observe isolation, focus-steal recording, host-restart durability, allowUnbound rejection, Wayland honesty, Pencil explicit-only) plus the dedicated unit suites for lease/state-machine/security/host/live behavior; duplicated cases were removed per owner §8 after the behavior-to-evidence audit, and live desktop claims are certified only by the live receipts, never by fake-WM tests.
    status: active
    verification:
      - command: "npx vitest run --root packages/mcp-guardian --config vitest.config.ts test/behavior-matrix.test.ts"

  - id: REQ-017
    statement: The live acceptance certify runner produces per-host receipts (OpenCode, DSH, Codex CLI, Codex desktop, non-GUI MCP, browser GUI MCP) with explicit status, evidence references and remaining capability gaps; BLOCKED/UNSUPPORTED entries carry exact reasons and never masquerade as PASS.
    status: active
    verification:
      - command: "node automation/mcp-certify.mjs --verify"

  - id: REQ-018
    statement: "No direct guardian bypass exists: registry-driven projection is the only MCP generation path, allowUnbound visible-local mode is rejected, and a static audit script verifies the absence of direct provider overrides and guardian-disable paths."
    status: active
    verification:
      - command: "node automation/mcp-no-bypass-audit.mjs"

  - id: REQ-019
    statement: "An explicit user-facing command (agent-rules mcp-session) exposes list/inspect/reconnect/stop/close-stale for persistent MCP sessions; sessions have no TTL and no idle expiry, explicit owner stop is the only normal terminal path, and close-stale preserves logical history."
    status: active
    verification:
      - command: "npx vitest run --root packages/cli --config ../vitest.config.ts test/mcp-session.test.ts"
