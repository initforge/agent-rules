version: 1
plan_id: adaptive-minimal-proof-testing

requirements:
  - id: REQ-001
    statement: "The adaptive-minimal-proof-testing behavior is defined in a canonical always-on rule (rules/) with a machine-checkable contract in rules/manifest.yaml (kind=invariant, trigger=always-load) and is enforced by a validator, not by prompts or optional skills."
    status: active
    verification:
      - command: "python3 automation/validate-rule-contracts.py"

  - id: REQ-002
    statement: "The trigger model derives activation from changed scope, affected claims, affected dependencies, risk class, runtime surface, project test architecture, host capability and required evidence fidelity — never from keywords alone."
    status: active
    verification:
      - command: "npx vitest run --root packages/kernel --config vitest.config.ts test/northstar/proof-trigger.test.ts"

  - id: REQ-003
    statement: "The proof-profile catalog supports evidence categories A–K (static/structural, unit/deterministic, contract/schema, integration, API/service, browser/UI, live runtime, security/isolation, performance/reliability, data/migration, packaging/installation) and eight default profiles (trivial/static, business logic, API/service, UI/browser, MCP/desktop/process/session, security/permissions, migration/data, performance/reliability) with automatic escalation and no silent downgrade."
    status: active
    verification:
      - command: "npx vitest run --root packages/kernel --config vitest.config.ts test/northstar/proof-profile.test.ts"

  - id: REQ-004
    statement: "The proof-selection engine selects the smallest proof set that can actually prove the claims: deterministic proof first, fidelity escalation only when the claim requires it; every selected proof records claim covered, proof identifier, sufficiency, environment, result, evidence path, limitations and escalation path; every omitted proof records category, reason, why omission is safe and the condition requiring escalation."
    status: active
    verification:
      - command: "npx vitest run --root packages/kernel --config vitest.config.ts test/northstar/proof-selection.test.ts"

  - id: REQ-005
    statement: "Live claims (browser, desktop, MCP availability/tools, handshake, process/window attribution, virtual desktop, focus, headed/visible mode, session persistence, reconnect, resource recreation, network/provider, host integration, real auth, real data-state) require real live proof; unit/fake evidence cannot replace live proof for a live claim; the smallest real provider with pinned versions is used; BLOCKED is reported when the environment capability is unavailable and UNSUPPORTED when the host cannot provide the seam."
    status: active
    verification:
      - command: "npx vitest run --root packages/kernel --config vitest.config.ts test/northstar/proof-live.test.ts"

  - id: REQ-006
    statement: "Every proof result is classified as exactly one of PASS | PARTIAL | BLOCKED | UNSUPPORTED | PRE-EXISTING | NEEDS_USER; PASS requires sufficient fresh evidence; BLOCKED/UNSUPPORTED are never converted into PASS; failures cannot be hidden by deleting or weakening tests; the whole task cannot be PASS while a required claim remains unresolved."
    status: active
    verification:
      - command: "npx vitest run --root packages/kernel --config vitest.config.ts test/northstar/proof-status.test.ts"

  - id: REQ-007
    statement: "The verification router emits a proof receipt containing task identity, repository, changed scope, claims, risks, selected proof profile, selected tests, omitted tests, omission reasons, escalation decisions, environment, results, evidence references and final status; the router works through CLI, North-Star runtime, plan/review/implementation flows, handoff/resume flows, MCP/provider flows and platform adapters."
    status: active
    verification:
      - command: "npx vitest run --root packages/kernel --config vitest.config.ts test/northstar/proof-receipt.test.ts"

  - id: REQ-008
    statement: "The test-refactor policy is global: audit and coverage-map before changing tests; protected tests (security, authorization, data integrity, migration, concurrency, lifecycle, regression, user-visible behavior) are preserved; every removed/merged/rewritten/downgraded test is recorded; post-refactor proof set runs and behavior coverage before/after is compared; forbidden operations (delete-to-green, weakened assertions, live-to-fake without claim change, silent flaky skips, retry-masked failures, behavior-change-to-fit-tests, delete-without-mapping) are rejected."
    status: active
    verification:
      - command: "npx vitest run --root packages/kernel --config vitest.config.ts test/northstar/proof-refactor.test.ts"

  - id: REQ-009
    statement: "Canonical schemas exist for behavior contract, trigger/activation contract, proof profile, claim-to-proof mapping, risk-to-proof escalation, omission reason, proof receipt and test-refactor matrix; schema validators pass on positive fixtures and reject negative fixtures."
    status: active
    verification:
      - command: "npx vitest run --root packages/kernel --config vitest.config.ts test/northstar/proof-schema.test.ts"

  - id: REQ-010
    statement: "Sixteen validation/eval cases (trivial change, backend logic, API authorization, schema migration, frontend/UI, browser interaction, MCP provider, desktop/window/focus, security/isolation, performance-sensitive, flaky/duplicate refactor, blocked live environment, project with no tests, over-broad suite, only live/browser tests, only unit tests for a live claim) each demonstrate correct trigger, correct proof profile, no unnecessary proof, required escalation, honest status classification, evidence receipt and no silent skip."
    status: active
    verification:
      - command: "npx vitest run --root packages/kernel --config vitest.config.ts test/northstar/proof-eval-cases.test.ts"

  - id: REQ-011
    statement: "A read-only project audit covers agent-rules, ZaloAI-Ecommerce and pos-ops reporting test runners, test categories, baseline counts, slow suites, duplicate patterns, browser/live capability, CI commands, missing proof layers, recommended minimal proof profile and project-specific escalation rules; the audit does not modify those projects' test files."
    status: active
    verification:
      - command: "npx vitest run --root packages/kernel --config vitest.config.ts test/northstar/proof-project-audit.test.ts"

  - id: REQ-012
    statement: "Platform mirrors are reconciled: source rule, generated route, installed mirror, platform projection, hash, activation path and native host limitations; native activation is never claimed from static file presence; NATIVE_UNVERIFIED is reported when activation is not proven."
    status: active
    verification:
      - command: "node automation/validate-repo-facts.mjs && python3 automation/validate-rule-contracts.py"

  - id: REQ-013
    statement: "Documentation defines the global always-on behavior (rule file, manifest contract, docs); the behavior is implemented in canonical behavior/verification layers, not only documented; a dedicated branch is committed and pushed after validation; the owner-managed Documents residual is untouched."
    status: active
    verification:
      - command: "node automation/validate-repo-facts.mjs"
