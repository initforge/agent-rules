# structural-map.schema.yaml — JSON Schema for structural-map.yaml
# Maps every source component/module to its target equivalent with explicit decisions.
$schema: "http://json-schema.org/draft-07/schema#"
title: StructuralMap
description: "One authoritative mapping per module — source component to target equivalent with create/adapt/reuse decision."
type: object
required:
  - component_mappings
  - nesting_hierarchy
  - routes
  - state_ownership
  - data_contracts
  - event_flows
  - planner_owns
properties:
  planner_owns:
    type: array
    items:
      type: string
    description: "List of mapping entries the planner explicitly owns (not delegated)."
  component_mappings:
    type: array
    items:
      type: object
      required:
        - source_component
        - target_component
        - decision
      properties:
        source_component:
          type: string
          description: "Full relative path or component name in the template."
        target_component:
          type: string
          description: "Full relative path or component name in the target module."
        decision:
          type: string
          enum: [create, adapt, reuse, not_applicable]
          description: "create=from scratch referencing template; adapt=copy then modify; reuse=import shared; not_applicable=no target equivalent."
        uncertainty:
          type: boolean
          description: "True if the mapping is uncertain and the planner must resolve."
        rationale:
          type: string
          description: "Why this decision was made."
        key_properties:
          type: array
          items:
            type: string
          description: "Props, interfaces, or contracts that must match."
  nesting_hierarchy:
    type: object
    description: "How components nest within each other."
    properties:
      parent_component:
        type: string
      child_components:
        type: array
        items:
          type: string
    additionalProperties: true
  routes:
    type: array
    items:
      type: object
      required:
        - path
        - component
        - breadcrumb_label
      properties:
        path:
          type: string
        component:
          type: string
        breadcrumb_label:
          type: string
        parent_path:
          type: string
        guard:
          type: string
        permission_key:
          type: string
  state_ownership:
    type: array
    items:
      type: object
      required:
        - state_key
        - owner
      properties:
        state_key:
          type: string
        owner:
          type: string
          description: "Component or store that owns this state."
        shared_with:
          type: array
          items:
            type: string
  data_contracts:
    type: array
    items:
      type: object
      required:
        - interface_or_type
        - source
      properties:
        interface_or_type:
          type: string
        source:
          type: string
        fields:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
              nullable:
                type: boolean
  event_flows:
    type: array
    items:
      type: object
      required:
        - event
        - producer
        - consumer
      properties:
        event:
          type: string
        producer:
          type: string
        consumer:
          type: string
        payload_type:
          type: string
