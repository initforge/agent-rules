# architecture-adaptation.schema.yaml — JSON Schema for architecture-adaptation.yaml
# Rules for architectural adaptation: what to preserve, adapt, and what must NOT be copied.
$schema: "http://json-schema.org/draft-07/schema#"
title: ArchitectureAdaptation
description: "Explicit architectural adaptation rules — prevents silent copying of forbidden patterns."
type: object
required:
  - preserve
  - adapt
  - must_not_copy
  - target_equivalents
  - accepted_deviations
properties:
  preserve:
    type: array
    items:
      type: object
      required:
        - pattern
        - rationale
      properties:
        pattern:
          type: string
        target_equivalent:
          type: string
        rationale:
          type: string
  adapt:
    type: array
    items:
      type: object
      required:
        - source_pattern
        - target_pattern
        - adaptation
      properties:
        source_pattern:
          type: string
        target_pattern:
          type: string
        adaptation:
          type: string
          description: "What changes between source and target."
        justification:
          type: string
  must_not_copy:
    type: array
    items:
      type: object
      required:
        - forbidden_pattern
        - reason
        - target_alternative
      properties:
        forbidden_pattern:
          type: string
          description: "Architecture or code pattern from source that must NOT appear in target."
        reason:
          type: string
        target_alternative:
          type: string
          description: "What to do instead."
  target_equivalents:
    type: array
    items:
      type: object
      required:
        - source
        - target
      properties:
        source:
          type: string
        target:
          type: string
        notes:
          type: string
  accepted_deviations:
    type: array
    items:
      type: object
      description: "Follows the custom_deviation_contract from pattern-inventory.yaml."
      required:
        - source
        - affected_surface
        - changed_invariant
        - rationale
        - unchanged_invariants
      properties:
        source:
          type: string
          description: "Approval source (owner, spec reference)."
        affected_surface:
          type: string
        changed_invariant:
          type: string
        rationale:
          type: string
        unchanged_invariants:
          type: array
          items:
            type: string
        proof:
          type: string
