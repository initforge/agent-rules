# parity-packet.schema.yaml — JSON Schema for the entire parity packet directory
# Validates that a module's packet directory contains all required files with correct structure.
$schema: "http://json-schema.org/draft-07/schema#"
title: ParityPacket
description: "Validates a complete parity packet directory for a 5fedu module."
type: object
required:
  - module_key
  - source
  - files
properties:
  module_key:
    type: string
    pattern: "^[a-z0-9-]+$"
  source:
    type: object
    required:
      - type
    properties:
      type:
        type: string
        enum: [new_module, existing_module_audit]
      template_reference:
        type: string
        description: "Reference module from module-mapping.md."
  files:
    type: array
    items:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          enum:
            - source.lock.yaml
            - target.yaml
            - structural-map.yaml
            - visual-contract.yaml
            - behavior-contract.yaml
            - architecture-adaptation.yaml
            - deviations.yaml
            - proof.yaml
        status:
          type: string
          enum: [complete, partial, pending]
        schema:
          type: string
          description: "Relative path to the validating schema."
  fixtures:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        purpose:
          type: string
          enum: [test_data, mock_response, negative_test, validation_fixture]
  planner_owned_mappings:
    type: array
    items:
      type: string
    description: "Mapping entries the planner has explicitly taken ownership of."
  negative_tests:
    type: array
    items:
      type: object
      required:
        - scenario
        - invariant
      properties:
        scenario:
          type: string
        invariant:
          type: string
        expected_outcome:
          type: string
