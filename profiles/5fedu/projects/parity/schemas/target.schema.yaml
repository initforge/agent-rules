# target.schema.yaml — JSON Schema for target.yaml
# Describes the target module and its metadata.
$schema: "http://json-schema.org/draft-07/schema#"
title: Target
description: "Describes the target module being built or audited."
type: object
required:
  - module_key
  - module_name
  - surfaces
  - target_paths
properties:
  module_key:
    type: string
    description: "Supabase-slug module key, e.g. 'nhap-hang'."
    pattern: "^[a-z0-9-]+$"
  module_name:
    type: string
    description: "User-facing Vietnamese module name, e.g. 'Nhập hàng'."
  surfaces:
    type: array
    items:
      type: string
      description: "Surface names matching pattern-inventory.yaml surface keys."
    minItems: 1
    uniqueItems: true
  target_paths:
    type: object
    description: "Relative paths in the target project."
    required:
      - feature_root
      - routes
      - components
    properties:
      feature_root:
        type: string
        description: "Feature directory, e.g. 'features/he-thong/nhap-hang/'."
      routes:
        type: array
        items:
          type: string
        description: "Route path(s) to register."
      components:
        type: array
        items:
          type: string
        description: "Key component files to create or modify."
      services:
        type: array
        items:
          type: string
      hooks:
        type: array
        items:
          type: string
      stores:
        type: array
        items:
          type: string
      tests:
        type: array
        items:
          type: string
  schema_source:
    type: object
    description: "Where variable content (fields, columns, filters) comes from."
    properties:
      type:
        type: string
        enum: [spec, supabase_table, api_endpoint, owner_confirmed]
      reference:
        type: string
        description: "Path or table name or URL."
      verified:
        type: boolean
        description: "True if the schema source was verified against actual code/DB."
