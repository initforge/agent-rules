# visual-contract.schema.yaml — JSON Schema for visual-contract.yaml
# Captures the visual parity contract per surface — what a non-vision worker must NOT invent.
$schema: "http://json-schema.org/draft-07/schema#"
title: VisualContract
description: "Visual parity contract per surface. A non-vision worker must receive a complete visual specification for each surface before implementing."
type: object
required:
  - surfaces
properties:
  surfaces:
    type: array
    items:
      type: object
      required:
        - surface_key
        - shell_must
        - variables
      properties:
        surface_key:
          type: string
          description: "Key matching pattern-inventory.yaml surface."
        shell_must:
          type: array
          items:
            type: string
          description: "Invariant visual elements from inventory, plus any surface-specific detail."
        variables:
          type: array
          items:
            type: object
            description: "Variable slots filled for this module."
            required:
              - slot
              - source
              - value_or_reference
            properties:
              slot:
                type: string
              source:
                type: string
                description: "Where the value comes from (spec, schema, owner)."
              value_or_reference:
                type: string
        alignment_notes:
          type: array
          items:
            type: string
          description: "Explicit spacing, typography, or color facts that cannot be inferred."
        responsive_breakpoints:
          type: array
          items:
            type: object
            properties:
              viewport:
                type: string
                enum: [mobile, tablet, desktop]
              layout_change:
                type: string
              safe_area:
                type: boolean
