# common.schema.yaml — canonical Draft-07 lexical contracts for parity artifacts
$schema: "http://json-schema.org/draft-07/schema#"
title: ParityCommonLexical
description: "Single lexical source for non-blank text and portable artifact paths."
definitions:
  nonBlank:
    type: string
    pattern: "\\S"
  portablePathBase:
    allOf:
      - $ref: "#/definitions/nonBlank"
      - type: string
        pattern: "^(?!~)(?!.*[\\\\%?#:<>\"|*])(?!.*(?:^|/)\\.\\.?(?:/|$))(?!.*\\.(?:/|$))(?!.*(?:^|/)(?:[Cc][Oo][Nn]|[Pp][Rr][Nn]|[Aa][Uu][Xx]|[Nn][Uu][Ll]|[Cc][Ll][Oo][Cc][Kk]\\$|[Cc][Oo][Nn][Ii][Nn]\\$|[Cc][Oo][Nn][Oo][Uu][Tt]\\$|[Cc][Oo][Mm][1-9]|[Ll][Pp][Tt][1-9])(?:\\.[^/]*)?(?:/|$))[!-.0-~](?:[ -.0-~]*[!-.0-~])?(?:/[!-.0-~](?:[ -.0-~]*[!-.0-~])?)*\\/?$(?![\\s\\S])"
  portablePath:
    allOf:
      - $ref: "#/definitions/portablePathBase"
      - not:
          type: string
          pattern: "/$(?![\\s\\S])"
  portableDirectory:
    allOf:
      - $ref: "#/definitions/portablePathBase"
      - type: string
        pattern: "/$(?![\\s\\S])"
  routePath:
    allOf:
      - $ref: "#/definitions/nonBlank"
      - type: string
        pattern: "^/(?!/)(?!.*[\\\\%?#:<>\"|*\\x00-\\x20\\x7f])(?!\\.{1,2}(?:/|$))(?!.*\\/\\.{1,2}(?:/|$))[A-Za-z0-9._~-]+(?:/[A-Za-z0-9._~-]+)*$(?![\\s\\S])"
