# deviations.schema.yaml — executable-parity Draft-07 contract
$schema: "http://json-schema.org/draft-07/schema#"
title: Deviations
description: "Closed owner-approved deviation declarations keyed by deviation ID."
type: object
additionalProperties: false
required:
  - default
  - allowed_only_when
  - deviations
properties:
  default:
    $ref: "common.schema.yaml#/definitions/nonBlank"
  allowed_only_when:
    $ref: "common.schema.yaml#/definitions/nonBlank"
  deviations:
    type: object
    minProperties: 1
    propertyNames:
      $ref: "common.schema.yaml#/definitions/nonBlank"
    additionalProperties:
      $ref: "#/definitions/deviation"
definitions:
  deviation:
    type: object
    additionalProperties: false
    required:
      - source
      - affected_surface
      - changed_invariant
      - rationale
      - unchanged_invariants
      - proof
    properties:
      source:
        $ref: "common.schema.yaml#/definitions/nonBlank"
      affected_surface:
        $ref: "common.schema.yaml#/definitions/nonBlank"
      changed_invariant:
        $ref: "common.schema.yaml#/definitions/nonBlank"
      rationale:
        $ref: "common.schema.yaml#/definitions/nonBlank"
      unchanged_invariants:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "common.schema.yaml#/definitions/nonBlank"
      proof:
        $ref: "common.schema.yaml#/definitions/nonBlank"

# Exact keyed equality with architecture-adaptation.yaml and proof approvals is
# a cross-document invariant enforced by the executable semantic gate.
