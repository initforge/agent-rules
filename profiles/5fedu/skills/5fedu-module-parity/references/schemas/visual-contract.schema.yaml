# visual-contract.schema.yaml — executable-parity Draft-07 contract
$schema: "http://json-schema.org/draft-07/schema#"
title: VisualContract
description: "Closed visual shell, variable-slot, and responsive contract for every target surface."
type: object
additionalProperties: false
required: [surfaces]
properties:
  surfaces:
    type: object
    minProperties: 1
    propertyNames:
      allOf:
        - $ref: "common.schema.yaml#/definitions/nonBlank"
        - pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
    additionalProperties:
      $ref: "#/definitions/surfaceDeclaration"
definitions:
  surfaceDeclaration:
    type: object
    additionalProperties: false
    required: [shell_must, variables, responsive_breakpoints]
    properties:
      shell_must:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "common.schema.yaml#/definitions/nonBlank"
      variables:
        type: array
        minItems: 1
        items:
          $ref: "#/definitions/variableDeclaration"
      alignment_notes:
        description: "Optional annotation; executable validation treats its value as opaque."
      responsive_breakpoints:
        type: array
        minItems: 1
        items:
          $ref: "#/definitions/responsiveBreakpoint"
  variableDeclaration:
    type: object
    additionalProperties: false
    required: [slot, source, value_or_reference]
    properties:
      slot:
        $ref: "common.schema.yaml#/definitions/nonBlank"
      source:
        $ref: "common.schema.yaml#/definitions/nonBlank"
      value_or_reference:
        $ref: "common.schema.yaml#/definitions/nonBlank"
  responsiveBreakpoint:
    type: object
    additionalProperties: false
    required: [viewport, layout_change, safe_area]
    properties:
      viewport:
        type: string
        enum: [mobile, tablet, desktop]
      layout_change:
        $ref: "common.schema.yaml#/definitions/nonBlank"
      safe_area:
        type: boolean
