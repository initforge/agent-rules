# architecture-adaptation.schema.yaml — executable-parity Draft-07 contract
$schema: "http://json-schema.org/draft-07/schema#"
title: ArchitectureAdaptation
description: "Closed preserve/adapt/forbid/equivalence contract with owner-approved deviations."
type: object
additionalProperties: false
required: [preserve, adapt, must_not_copy, target_equivalents, accepted_deviations]
properties:
  preserve:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [pattern, rationale]
      properties:
        pattern:
          $ref: "common.schema.yaml#/definitions/nonBlank"
        target_equivalent:
          $ref: "common.schema.yaml#/definitions/nonBlank"
        rationale:
          $ref: "common.schema.yaml#/definitions/nonBlank"
  adapt:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [source_pattern, target_pattern, adaptation]
      properties:
        source_pattern:
          $ref: "common.schema.yaml#/definitions/nonBlank"
        target_pattern:
          $ref: "common.schema.yaml#/definitions/nonBlank"
        adaptation:
          $ref: "common.schema.yaml#/definitions/nonBlank"
        justification:
          $ref: "common.schema.yaml#/definitions/nonBlank"
  must_not_copy:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [forbidden_pattern, reason, target_alternative]
      properties:
        forbidden_pattern:
          $ref: "common.schema.yaml#/definitions/nonBlank"
        reason:
          $ref: "common.schema.yaml#/definitions/nonBlank"
        target_alternative:
          $ref: "common.schema.yaml#/definitions/nonBlank"
  target_equivalents:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [source, target]
      properties:
        source:
          $ref: "common.schema.yaml#/definitions/portablePath"
        target:
          $ref: "common.schema.yaml#/definitions/portablePath"
        notes:
          $ref: "common.schema.yaml#/definitions/nonBlank"
  accepted_deviations:
    type: object
    minProperties: 1
    propertyNames:
      $ref: "common.schema.yaml#/definitions/nonBlank"
    additionalProperties:
      $ref: "deviations.schema.yaml#/definitions/deviation"

# Draft-07 validates each keyed declaration through the canonical deviations
# definition. Exact equality is enforced by the executable semantic gate.
