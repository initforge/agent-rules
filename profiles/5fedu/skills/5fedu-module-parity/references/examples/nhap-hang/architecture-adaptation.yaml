# architecture-adaptation.yaml — Example: Nhập hàng architecture rules
# Explicit rules: what to preserve, what to adapt, what must NOT be copied.
preserve:
  - pattern: "GenericToolbar filter chip pattern (search + chip group + reset)"
    target_equivalent: "nhap-hang-list GenericToolbar with date-based chips"
    rationale: "Filter chip pattern is a 5fedu invariant — not form comboboxes on toolbar"
  - pattern: "GenericDrawer shell (header, section grid, sticky footer)"
    target_equivalent: "nhap-hang-form and nhap-hang-detail both use GenericDrawer"
    rationale: "Drawer pattern is a 5fedu invariant — not modal or page navigation"
  - pattern: "RowActionsOverflowMenu portal behavior"
    target_equivalent: "nhap-hang-table-row-actions"
    rationale: "Portal must work on desktop and mobile; destructive separator required"
  - pattern: "DetailToolbar mirrors row overflow actions"
    target_equivalent: "nhap-hang-detail DetailToolbar"
    rationale: "Detail toolbar must have same permitted actions as row overflow"
  - pattern: "Event sync pattern (form/detail mutations refresh list without reload)"
    target_equivalent: "nhap-hang event flows"
    rationale: "Optimistic UI update pattern from Nhân viên reference"
adapt:
  - source_pattern: "Nhân viên filter chips (text-based search, cap_bac, phong_id filters)"
    target_pattern: "Nhập hàng filter chips (date-based: Hôm nay, Tuần, Tháng, Khoảng ngày)"
    adaptation: "Filter chip values change from entity attributes to date ranges; same chip component"
    justification: "Purchase receipt filtering is date-driven, not attribute-driven"
  - source_pattern: "Nhân viên form fields (employee-specific fields)"
    target_pattern: "Nhập hàng form fields (date, supplier picker, line-item table)"
    adaptation: "Form sections differ; first section general info, second section embedded line-item editor"
    justification: "Schema differs per phieu_nhap table; variable slot per inventory contract"
  - source_pattern: "Nhân viên row actions (Sửa, Xóa)"
    target_pattern: "Nhập hàng row actions (Sửa, Duyệt, In phiếu, Xóa)"
    adaptation: "Add Duyệt (approve) and In phiếu (print) actions for receipt workflow"
    justification: "Purchase receipt lifecycle requires approval and print; approved deviation"
must_not_copy:
  - forbidden_pattern: "Nhân viên's store/API/service implementation details beyond shell"
    reason: "Business logic and variable content are module-specific; only shell/shared patterns are invariant"
    target_alternative: "Implement nhap-hang service using phieu_nhap table schema; reuse only shared service primitives"
  - forbidden_pattern: "Hard-coded field labels or KPI values from Nhân viên"
    reason: "Variable slots must use module schema, not copy template module values"
    target_alternative: "All field labels, columns, KPI metrics from phieu_nhap schema or project spec"
  - forbidden_pattern: "Generic monolith/config page to avoid feature structure"
    reason: "Each surface must follow its dedicated component structure; no monolithic catch-all"
    target_alternative: "Create separate list, form, detail, stats components per structural map"
  - forbidden_pattern: "Route guard or permission logic specific to Nhân viên roles"
    reason: "Permission is module-specific; must use project's permission registry for nhap_hang keys"
    target_alternative: "Register nhap_hang_xem, nhap_hang_them, nhap_hang_sua, nhap_hang_xoa, nhap_hang_duyet in permission matrix"
target_equivalents:
  - source: "features/he-thong/nhan-vien/services/nhan-vien-service.ts"
    target: "features/he-thong/nhap-hang/services/nhap-hang-service.ts"
    notes: "Same service pattern but using phieu_nhap table via supabase client"
  - source: "features/he-thong/nhan-vien/hooks/use-nhan-vien.ts"
    target: "features/he-thong/nhap-hang/hooks/use-nhap-hang.ts"
    notes: "Same hook pattern for CRUD + stats"
  - source: "features/he-thong/nhan-vien/stores/nhan-vien-store.ts"
    target: "features/he-thong/nhap-hang/stores/nhap-hang-store.ts"
    notes: "Same Zustand store pattern; state shape differs per schema"
accepted_deviations:
  DEV-001:
    source: "owner spec section 4.2"
    affected_surface: form-drawer
    changed_invariant: "Section 2 of form drawer uses embedded line-item editor (EditableChildDataGrid) instead of static FormSection fields"
    rationale: "Purchase receipt requires variable-number-of-line-items entry; static form fields cannot support add/remove rows"
    unchanged_invariants:
      - "GenericDrawer shell (header, sectioned layout, sticky footer)"
      - "Section 1: standard FormSection/FormGrid with date, supplier picker"
      - "Hủy / Lưu footer behavior (disables controls, async submit, progress/error)"
      - "Focus trap, Escape close, backdrop behavior"
    proof: "Owner-approved wireframe in spec section 4.2; approval date 2026-07-20"
  DEV-002:
    source: "owner spec section 4.3"
    affected_surface: row-actions
    changed_invariant: "Duyệt (approve) action added as visible primary action alongside Sửa"
    rationale: "Purchase receipt approval is a frequent high-value action; requiring users to open detail drawer first creates friction"
    unchanged_invariants:
      - "Sửa remains visible primary when permitted"
      - "Overflow menu for secondary actions (In phiếu, Xóa)"
      - "Automatic separator before destructive Xóa action"
      - "Danger confirmation for Duyệt (irreversible status change)"
    proof: "Owner-approved spec 4.3; approval date 2026-07-20"
  DEV-003:
    source: "owner spec section 5.1"
    affected_surface: detail-drawer
    changed_invariant: "EmbeddedChildDataGrid for phieu_nhap_chi_tiet rows inside detail drawer"
    rationale: "Purchase receipt detail must show line items; this is a real parent-child relationship matching the embedded-child-grid surface pattern"
    unchanged_invariants:
      - "DetailToolbar with permitted actions"
      - "Hero summary with status badge"
      - "Sectioned cards with Thông tin chung card + Chi tiết hàng hóa card"
      - "Sticky Đóng / Sửa / Xóa footer"
    proof: "Aligns with embedded-child-grid surface in pattern-inventory.yaml; ref phong-ban detail"
