version: 1
load_order:
  - 00-intent-scope-safety.md
  - 10-execution-planning-delegation.md
  - 20-proof-outcome.md
  - 30-context-skill-mcp.md
  - 40-maintainer.md
budgets:
  bootstrap_tokens: 300
  core_total_tokens: 6500
  route_budgets_file: automation/context-route-cases.json
  platform_overlay_tokens: 600
  capability_tokens: 3500
  project_index_tokens: 1800
  lazy_project_pack_tokens: 8000

# Single natural communication rule is embedded in 00-intent-scope-safety.md:
# use user's language, outcome-first, plain words, technical detail only when it helps decision/debug/verification or when asked.

rule_contracts:
  00-intent-scope-safety.md:
    kind: invariant
    trigger: always-load
    normative: "Preserve intent, scope and safety; natural outcome-first communication."
    owner: harness-maintainer
    enforcement: intake-and-runtime-gates
    evidence: [rules/manifest.yaml, automation/validate-rule-contracts.py]
    precedence: 10
    failure: BLOCKED
    fixture: automation/validate-rule-contracts.py
  10-execution-planning-delegation.md:
    kind: invariant
    trigger: execution
    normative: "Ship outcomes, bounded delegation, strong planners for S2/S3."
    owner: harness-maintainer
    enforcement: runner-and-acceptance-reducer
    evidence: [rules/manifest.yaml, automation/validate-rule-contracts.py]
    precedence: 20
    failure: BLOCKED
    fixture: automation/validate-rule-contracts.py
  20-proof-outcome.md:
    kind: invariant
    trigger: always-load
    normative: "Minimal proof, no-worker-PASS, single truth closure."
    owner: harness-maintainer
    enforcement: proof-router-and-proof-selection
    evidence: [rules/manifest.yaml, packages/kernel/src/northstar/proof-router.ts, schemas/proof-receipt.schema.json, automation/validate-rule-contracts.py]
    precedence: 30
    failure: BLOCKED
    fixture: automation/validate-rule-contracts.py
  30-context-skill-mcp.md:
    kind: invariant
    trigger: context-selection
    normative: "Single skill resolver and integration broker per task."
    owner: harness-maintainer
    enforcement: graph-router-and-context-compiler
    evidence: [rules/manifest.yaml, automation/context-route-cases.json, automation/validate-rule-contracts.py]
    precedence: 40
    failure: BLOCKED
    fixture: automation/validate-rule-contracts.py
  40-maintainer.md:
    kind: policy
    trigger: harness-maintenance
    normative: "Maintainer edits canonical source first; no hand-edit of generated."
    owner: harness-maintainer
    enforcement: maintainer-pointer-audit
    evidence: [rules/manifest.yaml, automation/validate-rule-contracts.py]
    precedence: 50
    failure: BLOCKED
    fixture: automation/validate-rule-contracts.py
